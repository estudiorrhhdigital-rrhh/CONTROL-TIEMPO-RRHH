<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Tiempo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Control de Tiempo</h1>
    <span class="subtitle">Registro de horas por empresa y proyecto</span>
  </header>

  <main>
    <!-- Cronómetro -->
    <section class="card" id="timer-card">
      <h2>Cronómetro</h2>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-status" id="timer-status">Sin tarea en curso</div>

      <form id="timer-form" class="grid">
        <label>Empresa
          <input list="lista-empresas" id="t-empresa" placeholder="Ej: Acme S.A." autocomplete="off" required>
        </label>
        <label>Proyecto
          <input list="lista-proyectos" id="t-proyecto" placeholder="Ej: Liquidación de sueldos" autocomplete="off">
        </label>
        <label class="full">Descripción (opcional)
          <input id="t-descripcion" placeholder="¿Qué estás haciendo?" autocomplete="off">
        </label>
        <div class="full actions">
          <button type="submit" class="btn btn-start" id="btn-start">▶ Iniciar</button>
          <button type="button" class="btn btn-stop" id="btn-stop" hidden>■ Finalizar</button>
          <button type="button" class="btn btn-ghost" id="btn-cancel" hidden>Descartar</button>
        </div>
      </form>
      <datalist id="lista-empresas"></datalist>
      <datalist id="lista-proyectos"></datalist>

      <div id="recientes" class="recientes"></div>
    </section>

    <!-- Resumen -->
    <section class="card">
      <div class="card-head">
        <h2>Resumen</h2>
        <div class="filters">
          <select id="f-periodo">
            <option value="hoy">Hoy</option>
            <option value="semana">Esta semana</option>
            <option value="mes" selected>Este mes</option>
            <option value="mes-ant">Mes anterior</option>
            <option value="todo">Todo</option>
            <option value="rango">Rango…</option>
          </select>
          <input type="date" id="f-desde" hidden>
          <input type="date" id="f-hasta" hidden>
          <select id="f-empresa"><option value="">Todas las empresas</option></select>
        </div>
      </div>
      <div class="total-general">Total: <strong id="total-general">0 h 00 min</strong></div>
      <div id="resumen"></div>
    </section>

    <!-- Registros -->
    <section class="card">
      <div class="card-head">
        <h2>Registros</h2>
        <div class="actions">
          <button class="btn btn-ghost" id="btn-manual">+ Carga manual</button>
          <button class="btn btn-ghost" id="btn-csv">Exportar CSV</button>
          <button class="btn btn-ghost" id="btn-backup">Copia de seguridad</button>
          <label class="btn btn-ghost">Restaurar
            <input type="file" id="in-restore" accept="application/json" hidden>
          </label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Empresa</th><th>Proyecto</th><th>Descripción</th><th>Inicio</th><th>Fin</th><th>Duración</th><th></th></tr>
          </thead>
          <tbody id="registros"></tbody>
        </table>
      </div>
      <p class="empty" id="sin-registros">No hay registros en el período seleccionado.</p>
    </section>
  </main>

  <!-- Diálogo de edición / carga manual -->
  <dialog id="dlg">
    <form method="dialog" id="dlg-form" class="grid">
      <h3 class="full" id="dlg-title">Editar registro</h3>
      <label>Empresa <input list="lista-empresas" id="d-empresa" required></label>
      <label>Proyecto <input list="lista-proyectos" id="d-proyecto"></label>
      <label class="full">Descripción <input id="d-descripcion"></label>
      <label>Inicio <input type="datetime-local" id="d-inicio" required></label>
      <label>Fin <input type="datetime-local" id="d-fin" required></label>
      <p class="full error" id="dlg-error"></p>
      <div class="full actions">
        <button value="cancel" class="btn btn-ghost" formnovalidate>Cancelar</button>
        <button value="ok" class="btn btn-start" id="dlg-ok">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
